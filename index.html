<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OMNIPOTENT">
<meta name="theme-color" content="#F2F2F7">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>OMNIPOTENT</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<meta name="robots" content="noindex">
<style>
:root{
  --canvas:#E7E7EB; --bg:#F2F2F7; --card:#FFFFFF; --ink:#000;
  --ink2:#6E6E73; --ink3:rgba(60,60,67,.42); --sep:rgba(60,60,67,.14);
  --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20); --track:rgba(120,120,128,.16);
  --ok:#4E8A62; --warn:#A8742A; --bad:#B2463F;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--canvas)}
body{font-family:var(--text);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(1200px 600px at 50% -10%,#F7F7F9 0%,rgba(247,247,249,0) 70%),var(--canvas);
  display:flex;align-items:center;justify-content:center;padding:24px}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font-family:inherit}
.num,.big{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
svg.i.s{width:16px;height:16px;stroke-width:2}
svg.i.xs{width:13px;height:13px;stroke-width:2.4}

/* stage */
.stage{display:flex;gap:56px;align-items:center;justify-content:center}
.side{width:300px}
.side .k{font:600 12px/1 var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:10px}
.side h1{font:700 32px/1.05 var(--display);letter-spacing:-.025em}
.side p{font:400 14px/1.5 var(--text);color:var(--ink2);margin-top:12px}
.side ol{font:400 13.5px/1.6 var(--text);color:var(--ink2);margin:14px 0 0 18px}
.side ol b{color:#000;font-weight:600}
.side .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.side .ctl button{height:34px;padding:0 14px;border-radius:17px;background:#fff;font:600 13px/1 var(--text);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.side .ctl button.on{background:#000;color:#fff}

/* device */
.phone{width:390px;height:844px;border-radius:55px;position:relative;flex:none;
  box-shadow:0 0 0 10px #0E0E10,0 0 0 11px #3A3A3D,0 0 0 12.5px #CFCFD4,0 40px 80px -20px rgba(0,0,0,.35),0 18px 40px -18px rgba(0,0,0,.25)}
.screen{position:absolute;inset:0;border-radius:55px;overflow:hidden;background:var(--bg);isolation:isolate}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:54px 16px 124px}
.scroll::-webkit-scrollbar{display:none}
.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 46px;z-index:40;pointer-events:none}
.status .time{font:600 17px/1 var(--display)}
.status .sys{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:41}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:#000;z-index:80;pointer-events:none}
.edge-top{position:absolute;top:0;left:0;right:0;height:64px;z-index:30;pointer-events:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  background:linear-gradient(180deg,rgba(242,242,247,.92) 0%,rgba(242,242,247,.55) 60%,rgba(242,242,247,0) 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
.edge-bot{position:absolute;bottom:0;left:0;right:0;height:120px;z-index:30;pointer-events:none;background:linear-gradient(0deg,rgba(242,242,247,.85) 0%,rgba(242,242,247,0) 100%)}
@media (max-width:520px){
  body{padding:0;display:block}
  .stage{display:block}
  .side{display:none}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .screen{border-radius:0}
  .status,.island,.homebar{display:none}
  .scroll{padding-top:calc(env(safe-area-inset-top) + 14px)}
}

/* glass */
.glass{position:relative;isolation:isolate;background:rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(18px) saturate(1.9) brightness(1.04);backdrop-filter:blur(18px) saturate(1.9) brightness(1.04);
  box-shadow:0 12px 32px -6px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.06),inset 0 1px .5px rgba(255,255,255,.95),inset 0 -1px 1px rgba(0,0,0,.035)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:linear-gradient(155deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.35) 28%,rgba(0,0,0,.10) 62%,rgba(255,255,255,.8) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.gbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#000;flex:none}

/* type */
.lt{padding:6px 4px 14px}
.lt-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.eyebrow{font:600 13px/1 var(--text);color:var(--ink2);margin-bottom:7px}
.lt h1{font:700 34px/1.1 var(--display);letter-spacing:-.022em}
.me{width:36px;height:36px;border-radius:50%;background:linear-gradient(160deg,#E9E9EE,#D1D1D6);display:grid;place-items:center;font:600 14px/1 var(--text);color:#3A3A3C;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);cursor:pointer}
.card{background:var(--card);border-radius:24px;padding:16px;margin-bottom:12px}
.card.tap{cursor:pointer}
.cap{display:flex;align-items:center;gap:6px;font:600 13px/1 var(--text);color:var(--ink2)}
.cap .i{width:16px;height:16px;stroke-width:2;color:#000}
.cap .r{margin-left:auto;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:2px}
.big{font:700 44px/1 var(--display);letter-spacing:-.035em}
.huge{font:700 64px/0.95 var(--display);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.unit{font:600 17px/1 var(--text);color:var(--ink2);margin-left:5px;letter-spacing:-.01em}
.sub{font:400 13px/1.38 var(--text);color:var(--ink2)}
.h3{font:700 22px/1.15 var(--display);letter-spacing:-.02em}
.section-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 4px 8px}
.section-h h3{font:700 20px/1 var(--display);letter-spacing:-.02em}
.section-h span,.section-h button{font:500 14px/1 var(--text);color:var(--ink2)}
.section-h button{color:#000;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;width:100%;border-radius:25px;font:600 17px/1 var(--text);letter-spacing:-.01em}
.btn.black{background:#000;color:#fff;box-shadow:0 6px 16px -6px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.grey{background:var(--fill);color:#000}
.btn.sm{height:36px;border-radius:18px;font-size:15px;width:auto;padding:0 16px}
.btn:active{transform:scale(.985)}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:16px;background:var(--fill);font:600 13px/1 var(--text);color:#000;white-space:nowrap;cursor:pointer}
.pill.on{background:#000;color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;font:600 12px/1 var(--text);white-space:nowrap}
.tag.dark{background:#000;color:#fff}
.tag.soft{background:var(--fill);color:#000}
.tag.line{box-shadow:inset 0 0 0 1px var(--sep);color:var(--ink2)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.grey{background:#AEAEB2}
.st{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--text);white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:#000;transition:width .5s}
.bar.thick{height:10px;border-radius:5px}
.bar.grey i{background:#8E8E93}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.sep{border-top:.5px solid var(--sep)}

/* omni line */
.omni{display:flex;gap:12px;align-items:center;padding:12px 14px 12px 12px}
.omni img{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 .5px rgba(0,0,0,.1)}
.omni p{font:400 15px/1.33 var(--text);letter-spacing:-.005em}
.omni p b{font-weight:600}

/* list rows (inset grouped) */
.list{background:var(--card);border-radius:24px;padding:2px 16px;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:.5px solid var(--sep);cursor:pointer;min-height:52px}
.li:first-child{border-top:0}
.li .n{font:600 16px/1.2 var(--text);letter-spacing:-.01em}
.li .d{font:400 13px/1.3 var(--text);color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}
.li .v{margin-left:auto;font:500 15px/1.2 var(--text);color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .chev{color:var(--ink3);width:16px;height:16px;stroke-width:2.2}
.ic{width:32px;height:32px;border-radius:10px;background:#000;color:#fff;display:grid;place-items:center;flex:none}
.ic .i{width:17px;height:17px;stroke-width:2}
.ic.soft{background:var(--fill);color:#000}

/* today */
.mrow{display:flex;align-items:baseline;justify-content:space-between}
.mname{font:600 15px/1 var(--text);letter-spacing:-.01em}
.mval{font:600 15px/1 var(--text);font-variant-numeric:tabular-nums}
.mval span{color:var(--ink2);font-weight:500}
.minor{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
.minor .mname,.minor .mval{font-size:13px}
.minor .mname{color:var(--ink2)}
.meal{padding:13px 0;border-top:.5px solid var(--sep)}
.meal:first-of-type{border-top:0;padding-top:4px}
.meal-h{display:flex;align-items:center;justify-content:space-between}
.meal-h .n{font:600 16px/1 var(--text)}
.meal-h .k{font:600 15px/1 var(--text);font-variant-numeric:tabular-nums}
.meal-h .k span{color:var(--ink2);font-weight:500;font-size:13px}
.item{display:flex;justify-content:space-between;font:400 14px/1 var(--text);color:var(--ink2);padding:7px 0 0;font-variant-numeric:tabular-nums;cursor:pointer}
.item b{font-weight:500;color:#000}
.meal .pill{margin-top:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tiles .card{margin:0;padding:14px;cursor:pointer}
.tile .big{font-size:30px;margin:12px 0 5px}
.tile .unit{font-size:14px}
.glasses{display:flex;gap:3px;margin:10px 0 10px}
.glasses i{flex:1;height:16px;border-radius:5px;background:var(--track)}
.glasses i.on{background:#000}
.stp2{display:flex;gap:8px}
.stp2 button{flex:1;height:32px;border-radius:16px;background:var(--fill);display:grid;place-items:center}

/* tab bar */
.tabbar{position:absolute;left:14px;right:14px;bottom:22px;height:66px;border-radius:33px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.tab{width:62px;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(0,0,0,.52);font:600 10px/1 var(--text);cursor:pointer}
.tab .i{width:23px;height:23px}
.tab.on{color:#000;background:rgba(120,120,128,.16)}
.mic{width:56px;height:56px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;
  box-shadow:0 8px 18px -6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 4px rgba(0,0,0,.4)}
.mic .i{width:24px;height:24px;stroke-width:2}
@media (max-width:520px){ .tabbar{bottom:calc(env(safe-area-inset-bottom) + 10px)} }

/* layers: sheets, toasts */
#layer{position:absolute;inset:0;z-index:70;pointer-events:none}
#layer>*{pointer-events:auto}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.18);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:88%;border-radius:40px;padding:8px 18px 20px;display:flex;flex-direction:column;
  background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(28px) saturate(2) brightness(1.05);backdrop-filter:blur(28px) saturate(2) brightness(1.05);
  box-shadow:0 -10px 40px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.9);animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .in{overflow-y:auto;scrollbar-width:none;flex:1;padding-bottom:2px}
.sheet .in::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.grabber{width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.3);margin:0 auto 10px;flex:none}
.sh-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-top h2{font:700 22px/1.1 var(--display);letter-spacing:-.02em}
.xbtn{width:34px;height:34px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;color:rgba(0,0,0,.6);flex:none}
.toast{position:absolute;left:14px;right:14px;top:58px;min-height:60px;border-radius:30px;display:flex;align-items:center;gap:12px;padding:9px 18px 9px 9px;animation:drop .3s cubic-bezier(.2,.9,.3,1)}
@keyframes drop{from{transform:translateY(-24px);opacity:0}}
.toast .tro{width:42px;height:42px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;flex:none}
.toast .tro img{width:42px;height:42px;border-radius:50%}
.toast small{display:block;font:600 11px/1 var(--text);color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.toast b{font:600 15px/1.3 var(--text);letter-spacing:-.01em}
.snack{position:absolute;left:50%;transform:translateX(-50%);bottom:100px;height:44px;border-radius:22px;display:flex;align-items:center;gap:14px;padding:0 8px 0 18px;white-space:nowrap;font:600 14px/1 var(--text);animation:fade .2s}
.snack button{height:32px;padding:0 14px;border-radius:16px;background:#000;color:#fff;font:600 13px/1 var(--text)}
@media (max-width:520px){ .toast{top:calc(env(safe-area-inset-top) + 8px)} }

/* log sheet */
.listen{display:flex;align-items:center;gap:10px;font:600 15px/1 var(--text)}
.wave{display:flex;align-items:center;gap:3px;height:22px}
.wave i{width:3px;height:22px;border-radius:2px;background:#000;animation:w 1.1s ease-in-out infinite}
.wave.off i{animation:none;transform:scaleY(.3);background:var(--ink3)}
@keyframes w{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.bigmic{width:72px;height:72px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;margin:4px auto 12px;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.bigmic .i{width:30px;height:30px}
.bigmic.rec{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(0,0,0,.06),0 10px 24px -8px rgba(0,0,0,.5)}}
textarea.say{width:100%;border:0;background:rgba(255,255,255,.85);border-radius:20px;padding:14px 16px;font:600 19px/1.3 var(--display);letter-spacing:-.015em;resize:none;color:#000;outline:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
textarea.say::placeholder{color:var(--ink3)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -18px 0;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chips .pill{background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06);height:34px}
.chips .pill.on{background:#000;color:#fff}
.heard-h{display:flex;align-items:center;justify-content:space-between;padding:16px 4px 8px}
.heard-h b{font:600 12px/1 var(--text);color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.heard-h span{font:500 12px/1 var(--text);color:var(--ink2)}
.heard{background:rgba(255,255,255,.85);border-radius:22px;padding:2px 14px}
.hrow{display:flex;gap:12px;padding:12px 0;border-top:.5px solid var(--sep);align-items:flex-start}
.hrow:first-child{border-top:0}
.hrow .t{font:600 15px/1.25 var(--text);letter-spacing:-.01em}
.hrow .t span{color:var(--ink2);font-weight:500}
.hrow .v{margin-left:auto;font:600 15px/1.25 var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.hrow .lines{font:400 14px/1.5 var(--text);color:var(--ink2);margin-top:3px}

/* train */
.ex-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.reason{font:400 15px/1.38 var(--text);margin-top:10px}
.last{font:400 13px/1.35 var(--text);color:var(--ink2);margin-top:6px;font-variant-numeric:tabular-nums}
.mini-h{display:flex;justify-content:space-between;align-items:center;font:600 12px/1 var(--text);color:var(--ink2);letter-spacing:.05em;text-transform:uppercase}
.wu{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:9px}
.wu button{white-space:nowrap;height:34px;border-radius:11px;box-shadow:inset 0 0 0 1px var(--sep);display:flex;align-items:center;justify-content:center;gap:4px;font:600 13px/1 var(--text);font-variant-numeric:tabular-nums}
.wu button.on{background:var(--fill);box-shadow:none;color:var(--ink2)}
.sets{margin-top:14px;padding-top:10px;border-top:.5px solid var(--sep)}
.set-cols{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:8px;font:600 11px/1 var(--text);color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;padding:2px 0 6px}
.set-cols span:nth-child(2),.set-cols span:nth-child(3){text-align:center}
.set{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:8px;align-items:center;padding:4px 0}
.set .no{font:600 15px/1 var(--text);color:var(--ink2);font-variant-numeric:tabular-nums}
.stp{height:44px;border-radius:13px;background:var(--fill);display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.stp button{width:34px;height:40px;display:grid;place-items:center;color:rgba(0,0,0,.5)}
.stp button:disabled{opacity:.3}
.stp b{font:600 18px/1 var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stp b small{font-size:11px;color:var(--ink2);font-weight:500;margin-left:2px}
.done{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);display:grid;place-items:center;color:transparent}
.done.on{background:#000;color:#fff;box-shadow:none}
.done .i{width:19px;height:19px;stroke-width:2.6}
.note{margin:3px 0 6px 30px;font:400 13px/1.38 var(--text);color:var(--ink2)}
.note b{color:#000;font-weight:600}
.note.callout{background:var(--bg);border-radius:12px;padding:9px 11px;color:#000}
.coll{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.coll .n{font:600 16px/1.2 var(--text)}
.coll .d{font:400 13px/1.3 var(--text);color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.coll .cnt{margin-left:auto;font:600 13px/1 var(--text);color:var(--ink2);font-variant-numeric:tabular-nums}
.segs{display:flex;gap:4px;margin:0 2px 14px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--track)}
.segs i.on{background:#000}
.rest{position:absolute;left:12px;right:12px;bottom:22px;height:72px;border-radius:36px;z-index:55;display:flex;align-items:center;gap:12px;padding:0 10px 0 12px}
.rest .rt{font:700 26px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rest .rl{font:500 12px/1 var(--text);color:var(--ink2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest>div:nth-child(2){min-width:0;flex:1}
.rest .rl b{color:#000;font-weight:600}
.rest .acts{margin-left:auto;display:flex;gap:6px}
.rest .acts button{white-space:nowrap;height:44px;border-radius:22px;padding:0 15px;font:600 15px/1 var(--text)}
.rest .a1{background:rgba(120,120,128,.16)}
.rest .a2{background:#000;color:#fff}
@media (max-width:520px){ .rest{bottom:calc(env(safe-area-inset-bottom) + 10px)} }

/* progress */
.chart{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.legend2{display:flex;gap:14px;margin-top:10px;font:500 11px/1 var(--text);color:var(--ink2)}
.legend2 span{display:flex;align-items:center;gap:5px}
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat3>div{background:#fff;border-radius:18px;padding:12px}
.stat3 .l{font:600 11px/1 var(--text);color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.stat3 .v{font:700 20px/1 var(--display);letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat3 .s{font:500 11px/1.2 var(--text);color:var(--ink2);margin-top:4px}
.lbar{position:relative;height:6px;border-radius:3px;background:var(--track);margin-top:10px}
.lbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#000}
.why .act{display:flex;gap:10px;align-items:center;margin-top:10px;padding:11px 12px;border-radius:14px;background:var(--bg);font:600 14px/1.35 var(--text)}
.wkrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:.5px solid var(--sep)}
.wkrow:first-of-type{border-top:0;padding-top:4px}
.wkrow .ic{width:30px;height:30px;border-radius:50%}
.wkrow p{font:400 15px/1.35 var(--text);letter-spacing:-.005em}
.wkrow p b{font-weight:600}
.fix{background:#000;color:#fff;border-radius:16px;padding:13px 14px;margin-top:6px;display:flex;gap:10px;align-items:center;font:500 14px/1.35 var(--text)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.photo{aspect-ratio:3/4;border-radius:14px;background:linear-gradient(180deg,#E5E5EA,#D1D1D6);position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(0,0,0,.25)}
.photo svg{width:46%;height:auto}
.photo span{position:absolute;left:8px;bottom:7px;font:600 11px/1 var(--text);color:#3A3A3C}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:12px}
.meas .n{font:600 12px/1 var(--text);color:var(--ink2)}
.meas .v{font:700 22px/1 var(--display);letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.meas .v small{font:500 13px/1 var(--text);color:var(--ink2);margin-left:3px}
.meas .c{font:600 12px/1 var(--text);margin-top:5px;font-variant-numeric:tabular-nums}

/* stack */
.dose{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:.5px solid var(--sep)}
.dose:first-of-type{border-top:0}
.dose .n{font:600 16px/1.2 var(--text)}
.dose .d{font:400 13px/1.3 var(--text);color:var(--ink2);margin-top:3px}
.take{margin-left:auto;height:34px;padding:0 15px;border-radius:17px;background:#000;color:#fff;font:600 14px/1 var(--text);white-space:nowrap}
.take.done{background:var(--fill);color:var(--ink2);display:flex;align-items:center;gap:5px;box-shadow:none;width:auto}
.wk7{display:flex;gap:5px}
.wk7 i{width:10px;height:10px;border-radius:50%;background:var(--track)}
.wk7 i.on{background:#000}
.wk7 i.na{background:transparent;box-shadow:inset 0 0 0 1.5px var(--track)}
.math{background:var(--bg);border-radius:16px;padding:12px 14px;margin-top:12px}
.math .st2{display:flex;gap:10px;padding:7px 0;font:400 14px/1.4 var(--text);border-top:.5px solid var(--sep)}
.math .st2:first-child{border-top:0}
.math .st2 em{font-style:normal;font:700 12px/1.6 var(--text);color:var(--ink2);width:16px;flex:none}
.math .st2 b{font-weight:600}
.sites{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.site{border-radius:14px;padding:10px 12px;box-shadow:inset 0 0 0 1px var(--sep);cursor:pointer}
.site .n{font:600 14px/1.2 var(--text)}
.site .d{font:500 12px/1.2 var(--text);color:var(--ink2);margin-top:3px}
.site.next{background:#000;color:#fff;box-shadow:none}
.site.next .d{color:rgba(255,255,255,.7)}
.site.sel{box-shadow:inset 0 0 0 2px #000}
.fine{font:400 12px/1.45 var(--text);color:var(--ink2);padding:4px 6px 0;text-align:center}

/* forms */
.seg{display:flex;background:var(--fill);border-radius:12px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border-radius:10px;font:600 13px/1 var(--text);color:#000}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.field{background:rgba(255,255,255,.9);border-radius:16px;padding:4px 14px;margin-top:10px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
.fr{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-top:.5px solid var(--sep);gap:10px}
.fr:first-child{border-top:0}
.fr label{font:500 15px/1 var(--text)}
.fr input{border:0;background:transparent;text-align:right;font:600 16px/1 var(--text);width:140px;outline:none;font-variant-numeric:tabular-nums;color:#000}
.fr input.l{text-align:left;width:100%}
.fr .u{font:500 14px/1 var(--text);color:var(--ink2)}
.flabel{font:600 12px/1 var(--text);color:var(--ink2);letter-spacing:.05em;text-transform:uppercase;margin:16px 4px 0}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:left .2s}
.sw.on{background:#000}
.sw.on::after{left:22px}
.stepbig{display:flex;align-items:center;justify-content:center;gap:22px;margin:8px 0 6px}
.stepbig button{width:48px;height:48px;border-radius:50%;background:var(--fill);display:grid;place-items:center}
.stepbig .v{font:700 44px/1 var(--display);letter-spacing:-.03em;min-width:150px;text-align:center;font-variant-numeric:tabular-nums}
.stepbig .v small{font:600 17px/1 var(--text);color:var(--ink2);margin-left:4px}

/* onboarding */
.ob{position:absolute;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;padding:62px 22px 34px;overflow-y:auto}
@media (max-width:520px){ .ob{padding-top:calc(env(safe-area-inset-top) + 20px)} }
.ob .progress{display:flex;gap:5px;margin:14px 0 26px}
.ob .progress i{flex:1;height:4px;border-radius:2px;background:var(--track)}
.ob .progress i.on{background:#000}
.ob h1{font:700 32px/1.1 var(--display);letter-spacing:-.025em}
.ob .lead{font:400 16px/1.45 var(--text);color:var(--ink2);margin-top:8px}
.opt{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:16px;margin-top:10px;cursor:pointer;box-shadow:inset 0 0 0 1.5px transparent}
.opt.on{box-shadow:inset 0 0 0 2px #000}
.opt .ic{width:40px;height:40px;border-radius:12px}
.opt .n{font:600 17px/1.2 var(--text)}
.opt .d{font:400 13px/1.3 var(--text);color:var(--ink2);margin-top:2px}
.days{display:flex;gap:6px;margin-top:20px}
.days button{flex:1;height:52px;border-radius:14px;background:#fff;font:600 13px/1 var(--text)}
.days button.on{background:#000;color:#fff}

.stp .sin{width:100%;min-width:0;flex:1;border:0;background:transparent;text-align:center;font:600 18px/1 var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.01em;outline:none;color:#000;padding:0}
.stp .sin::placeholder{color:var(--ink3);font-size:15px}
.set{grid-template-columns:22px 1fr 1fr 44px}
.stp button{width:30px;flex:none}
.done{flex:none}
a{color:inherit}
input[type=number]::-webkit-inner-spin-button{display:none}
.side .ctl button{margin-bottom:2px}
.fitem{display:flex;justify-content:space-between;gap:14px;font:400 14px/1.3 var(--text);color:var(--ink2);padding:7px 0 0}
.fitem b{font-weight:500;color:#000}
.fitem span{text-align:right;max-width:52%}
@media (max-width:520px){ .edge-top{height:calc(env(safe-area-inset-top) + 12px)} }
.li>div:not(.ic):not(.sw){flex:1;min-width:0}
.dim{z-index:60}.sheet{z-index:61}#lw-toast .toast{z-index:65}#lw-snack .snack{z-index:64}
.mrow{gap:8px}.mval{white-space:nowrap}.mname{white-space:nowrap}
.side{display:none}</style>
</head>

/* ===== core: state, dates, engine ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let S=null;            // the whole saved state
let P=null;            // shortcut to S.plan
let NOW_OVERRIDE=null; // demo only

function now(){ return NOW_OVERRIDE?new Date(NOW_OVERRIDE.getTime()+(Date.now()-NOW_OVERRIDE._set)):new Date(); }
function dkey(d){ d=d||now(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function pkey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=pkey(k); d.setDate(d.getDate()+n); return dkey(d); }
function dayDiff(a,b){ return Math.round((pkey(b)-pkey(a))/864e5); }
function niceDate(k,withDay){ const d=pkey(k); return (withDay?DAYS[d.getDay()]+', ':'')+MON[d.getMonth()]+' '+d.getDate(); }
function today(){ return dkey(); }
function dow(k){ return pkey(k).getDay(); }
function clock(t){ const d=new Date(t); let h=d.getHours(),m=d.getMinutes(); const ap=h>=12?'pm':'am'; h=h%12||12; return h+':'+String(m).padStart(2,'0')+' '+ap; }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

/* ---------- program calendar ---------- */
function weekOf(k){ const d=dayDiff(P.start,k); return d<0?0:Math.floor(d/7)+1; }
function phaseOf(w){ return P.phases.find(p=>w>=p.w[0]&&w<=p.w[1])||null; }
function isDeload(w){ return P.deloads.includes(w); }
function blockPos(w){ // 1..4 inside a build block
  let last=0; for(const d of P.deloads){ if(d<w) last=d; } return Math.min(4,w-last); }
function sessionFor(k){ const dn=DAYS[dow(k)]; const s=P.schedule.find(x=>x.day===dn); return s&&s.name!=='Rest'?s:null; }
function rirFor(ex,w){
  if(w<1) return ex.rir;

  }

    let tw=topS.w, why;

    else if(topS.r>=hi){ tw=topS.w+inc(ex); why='You got '+topS.r+' on the top set last time, so +'+inc(ex)+' lb.'; }

/* merge two states (used on sync conflict). Logs are unioned by id/date. */
function mergeStates(a,b){
  const newer=(a.savedAt||0)>=(b.savedAt||0)?a:b, older=newer===a?b:a;
  const out=JSON.parse(JSON.stringify(newer)), o=JSON.parse(JSON.stringify(older.logs)), n=out.logs;
  ['sleep','sleepTs','waterTs','del','water','meals'].forEach(k=>{ if(!n[k]) n[k]={}; if(!o[k]) o[k]={}; });
  const del=Object.assign({},o.del,n.del); n.del=del;
  const byId=(x,y,key)=>{ const m=new Map(); x.forEach(v=>m.set(v[key],v)); y.forEach(v=>m.set(v[key],v)); return [...m.values()]; };
  // sessions: union, and inside a session union its sets; finished wins
  const sm=new Map(); (o.sessions||[]).forEach(s=>sm.set(s.id,s));
  (n.sessions||[]).forEach(s=>{ const p=sm.get(s.id); if(!p){ sm.set(s.id,s); return; }
    const sets=byId(p.sets,s.sets,'id'); sm.set(s.id,Object.assign({},p,s,{sets,endedAt:Math.max(p.endedAt||0,s.endedAt||0)||null,swaps:Object.assign({},p.swaps,s.swaps)})); });
  n.sessions=[...sm.values()].filter(s=>!del[s.id]).map(s=>Object.assign(s,{sets:s.sets.filter(x=>!del[x.id])})).sort((p,q)=>p.startedAt-q.startedAt);
  n.doses=byId(o.doses||[],n.doses||[],'id').filter(d=>!del[d.id]).sort((p,q)=>p.t-q.t);
  n.checkins=byId(o.checkins||[],n.checkins||[],'id');
  const byDayT=(x,y)=>{ const m=new Map(); x.forEach(v=>m.set(v.d,v)); y.forEach(v=>{ const p=m.get(v.d); if(!p||(v.t||0)>=(p.t||0)) m.set(v.d,v); }); return [...m.values()]; };
  n.weights=byDayT(o.weights||[],n.weights||[]); n.waist=byDayT(o.waist||[],n.waist||[]);
  for(const k in o.meals){ const om=o.meals[k], nm=n.meals[k]; if(!nm){ n.meals[k]=om; continue; }
    const od=om.dts||{}, nd=nm.dts||{}; nm.dts=Object.assign({},od,nd);
    new Set([...Object.keys(om.done||{}),...Object.keys(nm.done||{})]).forEach(i=>{ const a=od[i]||0, b2=nd[i]||0;
      if(a>b2){ nm.done[i]=!!om.done[i]; nm.dts[i]=a; } else if(!a&&!b2&&om.done[i]) nm.done[i]=true; });
    if((om.fts||0)>(nm.fts||0)){ nm.free=om.free; nm.fts=om.fts; }

  for(const k in o.sleep){ if(n.sleep[k]==null||(o.sleepTs[k]||0)>(n.sleepTs[k]||0)){ n.sleep[k]=o.sleep[k]; n.sleepTs[k]=o.sleepTs[k]||0; } }
  out.savedAt=Math.max(a.savedAt||0,b.savedAt||0);

}

function layer(){ const l=$('layer'); if(!$('lw-sheet')) l.innerHTML='<div id="lw-sheet"></div><div id="lw-rest"></div><div id="lw-snack"></div><div id="lw-toast"></div>'; }
function toast(title,sub,icon){ layer(); const el=$('lw-toast'); const ic=icon==='omni'?`<div class="tro" style="background:none"><img src="${OMNI}" alt=""></div>`:`<div class="tro">${I(icon||'check')}</div>`;
  el.innerHTML=`<div class="toast glass" onclick="this.parentNode.innerHTML=''">${ic}<div>${sub?`<small>${esc(sub)}</small>`:''}<b>${esc(title)}</b></div></div>`; clearTimeout(toast.h); toast.h=setTimeout(()=>el.innerHTML='',4200); }
let UNDO=null;
function snack(t,undo){ layer(); const el=$('lw-snack'); UNDO=undo||null; el.innerHTML=`<div class="snack glass" style="bottom:${VIEW==='session'?106:100}px">${esc(t)}${undo?'<button onclick="doUndo()">Undo</button>':''}</div>`; clearTimeout(snack.h); snack.h=setTimeout(()=>{el.innerHTML='';UNDO=null;},4000); }
function doUndo(){ if(UNDO)UNDO(); UNDO=null; $('lw-snack').innerHTML=''; save(); render(); }
function openSheet(html,cls){ layer(); $('lw-snack').innerHTML=''; $('lw-sheet').innerHTML=`<div class="dim" onclick="closeSheet()"></div><div class="sheet glass ${cls||''}"><div class="grabber"></div><div class="in">${html}</div></div>`; }
function closeSheet(){ if($('lw-sheet')) $('lw-sheet').innerHTML=''; }
function shTop(t,sub){ return `<div class="sh-top"><div><h2>${t}</h2>${sub?`<div class="sub" style="margin-top:4px">${sub}</div>`:''}</div><button class="xbtn" onclick="closeSheet()">${I('x','s')}</button></div>`; }
function go(v,a,noHist){ if(!noHist&&VIEW!==v) HIST.push([VIEW,ARG]); VIEW=v; ARG=a===undefined?null:a; closeSheet(); if($('lw-snack')) $('lw-snack').innerHTML=''; render(); $('scroll').scrollTop=0; }
function back(){ const h=HIST.pop(); if(h){ VIEW=h[0]; ARG=h[1]; } else { VIEW='today'; ARG=null; } render(); $('scroll').scrollTop=0; }
function lt(eyebrow,title,right){ return `<div class="lt"><div class="lt-row"><div>${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1>${title}</h1></div>${right||''}</div></div>`; }
function backBar(label,right){ return `<div class="row between" style="padding:6px 0 4px"><button class="gbtn glass" onclick="back()">${I('back')}</button>${right||''}</div>`; }
function meBtn(){ return `<div class="me" onclick="go('me')">${esc((S.profile.name||'J')[0])}</div>`; }
function omniLine(html){ return `<div class="card omni"><img src="${OMNI}" alt=""><p>${html}</p></div>`; }

function renderTabs(){
  const tb=$('tabbar'); if(VIEW==='session'||VIEW==='auth'){ tb.style.display='none'; return; } tb.style.display='';
  const on=v=>VIEW===v||(v==='today'&&['me','stack','item','health'].includes(VIEW))||(v==='progress'&&['lift','body'].includes(VIEW))||(v==='train'&&['preview','summary'].includes(VIEW));
  const t=(v,ic,l)=>`<div class="tab ${on(v)?'on':''}" onclick="HIST=[];go('${v}')">${I(ic)}<span>${l}</span></div>`;
  tb.innerHTML=t('today','today','Today')+t('train','train','Train')+`<div class="mic" onclick="quickLog()">${I('plus')}</div>`+t('food','fork','Food')+t('progress','progress','Progress');
}
const VIEWS={};
function render(){ if(!S){ return; } const f=VIEWS[VIEW]||VIEWS.today; $('scroll').innerHTML=f(ARG); renderTabs(); drawRest(); }

/* ===== quick log (+) ===== */
function quickLog(){
  const k=today(), wt=weightOn(k);
  const row=(ic,n,d,fn)=>`<div class="li" onclick="${fn}"><div class="ic">${I(ic)}</div><div><div class="n">${n}</div><div class="d">${d}</div></div>${I('chev','chev')}</div>`;
  openSheet(shTop('Log')+`<div class="list" style="background:rgba(255,255,255,.85)">
    ${row('scale','Morning weight',wt?wt+' lb today':'Not logged today',"weightSheet()")}
    ${row('fork','Meal',mealsDoneCount(k)+' of '+P.food.meals.length+' planned meals done',"closeSheet();go('food')")}
    ${row('drop','Water',(L().water[k]||0)+' of '+P.water.bottles+' bottles',"addWater(1);closeSheet()")}
    ${row('syringe','Dose',stackLine(k).short,"closeSheet();go('stack')")}
    ${row('moon','Sleep',L().sleep[k]!=null?L().sleep[k]+' h last night':'Not logged',"sleepSheet()")}
    ${row('ruler','Waist',(L().waist.length?L().waist[L().waist.length-1].in+' in, '+niceDate(L().waist[L().waist.length-1].d):'Not logged yet'),"waistSheet()")}
  </div>`);
}

/* ===== weight / sleep / waist / water ===== */
let WV=null;
function weightSheet(){
  const k=today(), ws=weights(); WV=weightOn(k)||(ws.length?ws[ws.length-1].lb:273);
  openSheet(shTop('Morning weight','After the bathroom, before food or water.')+`<div id="wsx"></div>
  <button class="btn black" style="margin-top:14px" onclick="saveWeight()">Save</button>`);
  drawW();
}
function drawW(){ $('wsx').innerHTML=`<div class="stepbig"><button onclick="WV=r1(WV-0.2);drawW()">${I('minus')}</button>
  <div class="v"><input id="wv" inputmode="decimal" value="${WV.toFixed(1)}" onchange="WV=r1(parseFloat(this.value)||WV)" style="width:150px;border:0;background:transparent;text-align:center;font:700 44px/1 var(--display);letter-spacing:-.03em;outline:none"><small>lb</small></div>
  <button onclick="WV=r1(WV+0.2);drawW()">${I('plus')}</button></div>`; }
function saveWeight(){ const v=parseFloat($('wv').value); if(!(v>80&&v<600)){ toast('Check that number','Weight'); return; }
  const k=today(), xs=L().weights, i=xs.findIndex(w=>w.d===k); if(i>=0) xs[i].lb=r1(v); else xs.push({d:k,lb:r1(v),t:Date.now()});
  save(); closeSheet(); render(); const tr=trend(); toast(r1(v)+' lb logged. Trend '+tr[tr.length-1].t+' lb','Weight'); }
function sleepSheet(){ const k=today(), cur=L().sleep[k];
  openSheet(shTop('Sleep last night')+`<div class="chips" style="flex-wrap:wrap;margin:0">${[5,5.5,6,6.5,7,7.5,8,8.5,9].map(h=>`<span class="pill ${cur===h?'on':''}" onclick="L().sleep['${k}']=${h};L().sleepTs['${k}']=Date.now();save();closeSheet();render();snack('Sleep ${h} h logged')">${h} h</span>`).join('')}</div><div class="fine" style="margin-top:14px;text-align:left">Aim for 7.5 to 8 hours. Under 6 hours for 3 nights in a week means an easier training week.</div>`); }
function waistSheet(){ const xs=L().waist, last=xs.length?xs[xs.length-1].in:46; WV=last;
  openSheet(shTop('Waist','At the belly button, morning, relaxed, after breathing out.')+`<div id="wsx"></div><button class="btn black" style="margin-top:14px" onclick="saveWaist()">Save</button>`);
  $('wsx').innerHTML=`<div class="stepbig"><button onclick="WV=r1(WV-0.25);waistDraw()">${I('minus')}</button><div class="v" id="wvv"></div><button onclick="WV=r1(WV+0.25);waistDraw()">${I('plus')}</button></div>`; waistDraw(); }
function waistDraw(){ $('wvv').innerHTML=(Math.round(WV*100)/100)+'<small>in</small>'; }
function saveWaist(){ const k=today(), xs=L().waist, i=xs.findIndex(w=>w.d===k); if(i>=0) xs[i].in=WV; else xs.push({d:k,in:WV}); save(); closeSheet(); render(); snack('Waist '+WV+' in logged'); }
function addWater(n){ const k=today(); const prev=L().water[k]||0; L().water[k]=Math.max(0,Math.min(12,prev+n)); L().waterTs[k]=Date.now(); save(); render(); if(n>0) snack('Water '+L().water[k]+' of '+P.water.bottles+' bottles',()=>{L().water[k]=prev;L().waterTs[k]=Date.now();}); }
function setWater(n){ const k=today(); const prev=L().water[k]||0; L().water[k]=(prev===n?n-1:n); L().waterTs[k]=Date.now(); save(); render(); }

/* ===== stack summary helpers ===== */
function stackDue(k){ return stackItems().filter(it=>dueOn(it,k)); }
function stackLine(k){
  const due=stackDue(k), done=due.filter(it=>dosesOn(it,k).length);
  if(!due.length) return {short:'Nothing due today',long:'Nothing scheduled today.'};
  const left=due.filter(it=>!dosesOn(it,k).length).map(it=>it.name.replace(/ \(.*\)/,''));
  return {short:done.length+' of '+due.length+' taken today',long:left.length?('Left today: '+left.join(', ')+'.'):'All done for today.'};
}

/* ===== TODAY ===== */
VIEWS.today=function(){
  const k=today(), w=weekOf(k), d=pkey(k), ph=phaseOf(w);
  const ebrow=DAYL[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate();
  let h=lt(ebrow,w<1?'Hi '+esc(S.profile.name):w>P.weeks?'Program complete':'Week '+w+' of '+P.weeks,meBtn());
  if(w>P.weeks){ h+=omniLine(`<b>All ${P.weeks} weeks done.</b> Siddharth will send your next plan. Keep logging food and weight until then.`); }
  if(w<1){ h+=omniLine(`<b>Your program starts ${niceDate(P.start,true)}.</b> Food starts today: tick off your meals as you eat them and log your weight each morning.`); }
  else if(ph) h+=`<div class="row" style="gap:8px;margin:-4px 4px 12px;flex-wrap:wrap"><span class="tag ${isDeload(w)?'dark':'soft'}">${esc(ph.name)}</span><span class="sub">${esc(ph.note)}</span></div>`;
  // morning check-in strip
  if(weightOn(k)==null) h+=`<div class="card row" style="gap:12px;padding:12px 14px"><div class="ic soft">${I('sun')}</div><div style="flex:1"><div class="mname">Morning weigh-in</div><div class="sub" style="margin-top:3px">Before food or water</div></div><button class="btn black sm" onclick="weightSheet()">Log</button></div>`;
  // food
  const t=foodTargets(k), e=eaten(k), kl=t.kcal-e.kcal, pl=t.p-e.p, dd=foodDay(k);
  const nextI=P.food.meals.findIndex((m,i)=>!dd.done[i]);
  let line;
  if(nextI<0) line=pl>10?`<b>All meals done, ${pl} g protein short.</b> Add a scoop of whey.`:t.brk?`<b>Every meal done.</b> Diet break week: eat ${fmtN(Math.max(0,kl))} more kcal, mostly carbs like rice, potatoes or cream of rice.`:kl<-150?`<b>${fmtN(-kl)} kcal over today.</b> Fine once a week. Back on plan tomorrow.`:'<b>Every meal done today.</b> That is how the weight comes off.';
  else line=`<b>Next: ${esc(P.food.meals[nextI].name)}</b>, ${esc(P.food.meals[nextI].time)}. ${P.food.meals[nextI].kcal} kcal, ${P.food.meals[nextI].p} g protein.`;
  h+=`<div class="card tap" onclick="go('food')"><div class="cap">${I('fork')} Food<span class="r">${mealsDoneCount(k)} of ${P.food.meals.length} meals ${I('chev','xs')}</span></div>
   <p style="font:400 15px/1.35 var(--text);margin-top:12px">${line}</p>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px">
    <div><div class="big" style="font-size:34px">${fmtN(Math.abs(kl))}</div><div class="sub" style="margin-top:4px">${kl<0?'kcal over':'kcal left'}</div><div class="bar" style="margin-top:9px"><i style="width:${Math.min(100,e.kcal/t.kcal*100)}%;background:#8E8E93"></i></div></div>
    <div><div class="big" style="font-size:34px">${Math.max(0,pl)}<span class="unit">g</span></div><div class="sub" style="margin-top:4px">protein to go</div><div class="bar" style="margin-top:9px"><i style="width:${Math.min(100,e.p/t.p*100)}%"></i></div></div></div>
   ${nextI>=0?`<div style="margin-top:14px" onclick="event.stopPropagation()"><span class="pill" onclick="tickMeal(${nextI})">${I('check','s')} Ate ${esc(P.food.meals[nextI].name)} as planned</span></div>`:''}
   ${t.brk?'<div class="sub" style="margin-top:10px">Diet break week: maintenance calories.</div>':''}</div>`;
  // workout
  const ss=sessionFor(k), doneS=L().sessions.find(s=>s.date===k&&s.name===(ss&&ss.name));
  if(ss&&w>=1&&w<=P.weeks){ const exs=exList(ss.name), main=exs[0], tg=targetFor(main,ss.name,k);
    h+=`<div class="card"><div class="cap">${I('train')} Workout<span class="r">Today</span></div>
     <div class="h3" style="margin-top:12px">${esc(ss.name)}</div><div class="sub" style="margin-top:4px">${esc(ss.focus)}</div>
     <div style="font:600 16px/1.3 var(--text);margin-top:12px">${esc(main.name)}: ${doneS&&doneS.endedAt&&workSets(doneS,main).length?workSets(doneS,main).map(x=>x.w+'×'+x.r).join(', '):(tg.w?tg.w+' lb × ':'')+tg.lo+' to '+tg.hi+' reps'+(tg.w?'':', your weight')}</div>
     <div class="sub" style="margin-top:3px">+${exs.length-1} more: ${exs.slice(1,3).map(x=>esc(x.name)).join(', ')}${exs.length>3?'…':''}</div>
     ${doneS&&doneS.endedAt?`<button class="btn grey" style="margin-top:14px" onclick="go('summary','${doneS.id}')">${I('check','s')} Done. See how it went</button>`:
       `<button class="btn black" style="margin-top:14px" onclick="startSession('${esc(ss.name)}')">${doneS?'Resume':'Start'} ${esc(ss.name)}</button>`}</div>`;
  } else if(w>P.weeks){ } else if(w>=1){ h+=`<div class="card"><div class="cap">${I('train')} Workout<span class="r">Today</span></div><div class="h3" style="margin-top:12px">Rest day</div><div class="sub" style="margin-top:4px">Easy walk only. Meal prep and your weekly check-in.</div></div>`; }
  else { const first=P.schedule.find(s=>s.day==='Mon'); h+=`<div class="card tap" onclick="go('preview','${esc(first.name)}')"><div class="cap">${I('train')} First workout<span class="r">${niceDate(P.start,true)} ${I('chev','xs')}</span></div><div class="h3" style="margin-top:12px">${esc(first.name)}</div><div class="sub" style="margin-top:4px">Tap to preview every exercise, set and rep range.</div></div>`; }
  // check-in on Sunday
  if(dow(k)===0&&w>=1&&!L().checkins.find(c=>c.d===k)) h+=`<div class="card row" style="gap:12px;padding:14px"><div class="ic">${I('flag')}</div><div style="flex:1"><div class="mname">Weekly check-in</div><div class="sub" style="margin-top:3px">2 minutes. Goes straight to Siddharth.</div></div><button class="btn black sm" onclick="checkinSheet()">Start</button></div>`;
  // stack
  const due=stackDue(k), sl=stackLine(k);

/* ===== SESSION ===== */
let CUR=null, DRAFT={}, REST=null, WAKE=null;
function startSession(name){
  closeStale(); const k=today(); let s=L().sessions.find(x=>!x.endedAt&&x.name===name&&x.date===k);
  if(!s){ s={id:uid(),date:k,name:name,week:Math.max(1,weekOf(k)),startedAt:NOWT(),endedAt:null,sets:[],swaps:{},note:''}; L().sessions.push(s); save(); }
  CUR=s.id; DRAFT={}; keepAwake(); go('session',s.id);
}
function curSess(){ return L().sessions.find(s=>s.id===(ARG||CUR)); }
function sessEx(s){ return exList(s.name).map(ex=>s.swaps&&s.swaps[ex.id]?Object.assign({},ex,{name:s.swaps[ex.id],swapped:ex.name,start:null}):ex); }
async function keepAwake(){ try{ if('wakeLock' in navigator){ WAKE=await navigator.wakeLock.request('screen'); } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&VIEW==='session') keepAwake(); });
function draftFor(s,ex,i,tg){
  const key=ex.id+'#'+i; if(DRAFT[key]) return DRAFT[key];
  const logged=s.sets.find(x=>x.ex===ex.id&&!x.warm&&x.n===i);
  if(logged) return DRAFT[key]={w:logged.w,r:logged.r};
  const prevSet=prevSetFor(ex,tg,i,s.week), st=setTarget(ex,tg,i,s.week);
  let w=st.w; const earlier=s.sets.filter(x=>x.ex===ex.id&&!x.warm);
  // straight sets: carry today's weight forward. Build-up sets: start from the last one and add
  if(earlier.length&&!ex.scheme) w=earlier[earlier.length-1].w;
  if(ex.scheme&&w==null&&earlier.length) w=earlier[earlier.length-1].w;
  return DRAFT[key]={w:w,r:prevSet&&w!=null&&w===prevSet.w?Math.min(st.hi,prevSet.r+1):st.hi};
}

VIEWS.stack=function(){

       ${due||it.freq.kind==='asneeded'?`<button class="take ${dn?'done':''}" onclick="event.stopPropagation();${dn?`go('item','${it.id}')`:(it.route==='inj'?`doseSheet('${it.id}')`:`takeQuick('${it.id}')`)}">${dn?I('check','xs')+' Done':'Log'}</button>`:I('chev','chev')}</div>`; }).join('')}</div>`; });

  h+=`<div class="fine">This is a log of what your clinic prescribed. The app never changes or suggests doses. Any question about them goes to your doctor.</div>`;
  return h;
};
function mlOf(it){ return Math.round(it.dose/it.conc*100)/100; }
function doseText(it){ return it.dose?it.dose+' '+it.unit+(it.conc&&it.route==='inj'?' ('+mlOf(it)+' ml)':''):'As prescribed'; }
function freqText(it){ const f=it.freq; if(f.kind==='daily') return 'every day'; if(f.kind==='asneeded') return 'as your doctor told you';
  const ds=(f.days||[]).map(d=>DAYS[d]); return (ds.length===1?'weekly, '+ds[0]:ds.join(' + ')); }
VIEWS.item=function(id){
  const it=S.stack.find(x=>x.id===id); if(!it) return VIEWS.stack();
  const xs=L().doses.filter(d=>d.item===id).slice().reverse();

   <button class="btn black sm" onclick="${it.route==='inj'?`doseSheet('${id}')`:`takeQuick('${id}')`}">Log dose</button></div>${it.note?`<div class="sub" style="margin-top:12px;color:#000">${esc(it.note)}</div>`:''}</div>`;
  if(it.route==='inj'){
    if(it.conc&&it.dose){ const ml=it.dose/it.conc; h+=`<div class="card"><div class="cap">${I('vial')} How much to draw</div><div class="math"><div class="st2"><em>1</em><span>Your vial is <b>${it.conc} mg per ml</b>.</span></div><div class="st2"><em>2</em><span>Your dose is <b>${it.dose} mg</b>.</span></div><div class="st2"><em>3</em><span>Dose ÷ strength: ${it.dose} ÷ ${it.conc} = <b>${mlOf(it)} ml</b> to draw.</span></div></div><div class="fine" style="text-align:left;margin-top:8px">Check this against what your clinic told you. If they differ, follow the clinic.</div></div>`; }
    else h+=`<div class="card"><div class="cap">${I('vial')} Vial strength</div><p class="sub" style="margin-top:8px;color:#000">Add the strength printed on your vial (mg per ml) and the app shows how many ml that dose is.</p><button class="btn grey sm" style="margin-top:12px" onclick="editItem('${id}')">Add vial strength</button></div>`;
    const ns=nextSite(), last={}; L().doses.forEach(d=>{ if(d.site) last[d.site]=d.d; });
    h+=`<div class="card"><div class="cap">${I('body')} Sites<span class="r">rotate them</span></div><div class="sites">${SITES.map(s=>`<div class="site ${s[0]===ns?'next':''}"><div class="n">${s[1]}</div><div class="d">${s[0]===ns?'Next up':last[s[0]]?'Last '+niceDate(last[s[0]]):'Not used yet'}</div></div>`).join('')}</div></div>`;
  }
  h+=`<div class="section-h"><h3>History</h3><span>${xs.length} logged</span></div><div class="list">${xs.slice(0,20).map(d=>`<div class="li" onclick="delDose('${d.id}')"><div><div class="n" style="font-weight:500">${niceDate(d.d,true)}, ${clock(d.t)}</div><div class="d">${d.amt?d.amt+' '+d.unit:'Taken'}${d.site?' · '+siteName(d.site):''}</div></div>${I('x','chev')}</div>`).join('')||'<div class="li"><div class="d">Nothing logged yet.</div></div>'}</div>`;
  h+=`<div class="fine">Tap a history row if you need to delete it.</div>`;
  return h;
};
function delDose(id){ const d=L().doses.find(x=>x.id===id), it=S.stack.find(x=>x.id===d.item);

function delDoseGo(id){ const d=L().doses.find(x=>x.id===id); L().doses=L().doses.filter(x=>x.id!==id); tomb(id); save(); closeSheet(); render(); snack('Dose removed',()=>{ untomb(id); L().doses.push(d); L().doses.sort((a,b)=>a.t-b.t); }); }
let DS=null;
function doseSheet(id){ const it=S.stack.find(x=>x.id===id); DS={id,site:nextSite(),amt:it.dose};
  openSheet(shTop(esc(it.name),doseText(it))+`<div id="dsx"></div><button class="btn black" style="margin-top:14px" onclick="saveDose()">Log it</button>`); drawDose(); }
function drawDose(){ const it=S.stack.find(x=>x.id===DS.id);

function saveDose(){ const it=S.stack.find(x=>x.id===DS.id), k=today(); const site=it.route==='inj'?DS.site:null; const d={id:uid(),item:it.id,d:k,t:NOWT(),amt:DS.amt,unit:it.unit,site}; L().doses.push(d); save(); closeSheet(); render(); snack(it.name+' logged'+(site?', '+siteName(site):''),()=>{ L().doses=L().doses.filter(x=>x.id!==d.id); }); }
let ED=null;
function editItem(id){ const it=id?S.stack.find(x=>x.id===id):{id:null,name:'',kind:'supp',route:'oral',dose:null,unit:'mg',freq:{kind:'daily'},conc:null,note:''}; ED=JSON.parse(JSON.stringify(it));

   ${ED.route==='inj'?`<div class="field"><div class="fr"><label>Vial strength</label><span><input inputmode="decimal" style="width:80px" value="${ED.conc||''}" placeholder="e.g. 200" onchange="ED.conc=parseFloat(this.value)||null"> <span class="u">mg/ml</span></span></div></div>`:''}
   <div class="flabel">When</div><div class="seg" style="margin-top:8px">${[['daily','Daily'],['days','Set days'],['asneeded','As told']].map(([k2,l])=>`<button class="${(f.kind===k2||(k2==='days'&&f.kind==='weekly'))?'on':''}" onclick="ED.freq={kind:'${k2}',days:ED.freq.days||[1]};drawEd()">${l}</button>`).join('')}</div>
   ${f.kind==='days'||f.kind==='weekly'?`<div class="days" style="margin-top:10px">${[1,2,3,4,5,6,0].map(d=>`<button class="${(f.days||[]).includes(d)?'on':''}" onclick="togDay(${d})">${DAYS[d]}</button>`).join('')}</div>`:''}
   ${ED.kind==='clinic'?'<div class="fine" style="text-align:left;margin-top:12px">Enter exactly what your clinic prescribed.</div>':''}`; }
function togDay(d){ const ds=ED.freq.days||[]; ED.freq.days=ds.includes(d)?ds.filter(x=>x!==d):ds.concat(d); if(!ED.freq.days.length) ED.freq.days=[d]; drawEd(); }
function saveItem(){ if(!ED.name.trim()){ toast('Add a name',null,'x'); return; } if(ED.freq.kind==='weekly') ED.freq.kind='days';

function rmItem(id){ const it=S.stack.find(x=>x.id===id), i=S.stack.indexOf(it); S.stack.splice(i,1); save(); closeSheet(); go('stack'); snack(it.name+' removed',()=>{ S.stack.splice(i,0,it); }); }

function b64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return Uint8Array.from(atob(s),c=>c.charCodeAt(0)); }
async function openInvite(){
  const m=location.hash.match(/k=([A-Za-z0-9_-]+)/); let key=m?m[1]:null;
  try{ if(key) localStorage.setItem('omni_trk_inv',key); else key=localStorage.getItem('omni_trk_inv'); }catch(e){}
  if(m) history.replaceState(null,'',location.pathname+location.search);
  if(!key||!INVITE||INVITE.indexOf('__')===0) return null;
  try{ const raw=b64u(INVITE), iv=raw.slice(0,12), ct=raw.slice(12);
    const k=await crypto.subtle.importKey('raw',b64u(key),'AES-GCM',false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct); return JSON.parse(new TextDecoder().decode(pt)); }catch(e){ return null; }
}

/* storage: Firestore doc trk/{uid} holding the gzipped state, with a version number for compare-and-swap */
let FSDB=null;
function fdb(){ if(!FSDB) FSDB=firebase.firestore(); return FSDB; }
async function gz(str){ if(typeof CompressionStream==='undefined') return null; const st=new Blob([str]).stream().pipeThrough(new CompressionStream('gzip')); return new Uint8Array(await new Response(st).arrayBuffer()); }
async function gunz(u8){ const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip')); return await new Response(st).text(); }
async function readDoc(d){ if(!d||!d.exists) return {state:null,savedAt:0,version:0}; const x=d.data(); let st=null;
  try{ st=x.z?JSON.parse(await gunz(x.z.toUint8Array())):(x.j?JSON.parse(x.j):null); }catch(e){ st=null; }
  return {state:st,savedAt:x.savedAt||0,version:x.version||0}; }
async function api(method,path,body){
  const u=firebase.auth().currentUser; if(!u) throw new Error('signed out');
  const ref=fdb().collection('trk').doc(u.uid);
  if(method==='GET'){ const d=await ref.get({source:'server'}); return {status:200,body:await readDoc(d)}; }
  const json=JSON.stringify(body.state), z=await gz(json);
  const payload=z?{z:firebase.firestore.Blob.fromUint8Array(z)}:{j:json};
  payload.savedAt=Number(body.savedAt)||Date.now(); payload.at=firebase.firestore.FieldValue.serverTimestamp();
  let res=null;
  await fdb().runTransaction(async tx=>{ const d=await tx.get(ref); const cur=d.exists?(d.data().version||0):0;
    if(body.version!=null&&Number(body.version)!==cur){ res={conflict:d}; return; }
    tx.set(ref,Object.assign({},payload,{version:cur+1})); res={version:cur+1}; });
  if(res&&res.conflict) return {status:409,body:await readDoc(res.conflict)};
  return {status:200,body:{version:res.version}};
}
let pushT=null;
onSave=function(){ if(MODE!=='live') return; PENDING=true; clearTimeout(pushT); pushT=setTimeout(push,1200); };
function cacheNow(){ try{ localStorage.setItem(cacheKey(),JSON.stringify(S)); }catch(e){} }
/* push never uses a blind write: without a known server version it pulls and merges first */
async function push(retry){
  if(MODE!=='live'||!S||!S.TRK) return;
  if(PUSHING){ clearTimeout(pushT); pushT=setTimeout(push,800); return; }
  if(VERSION==null){ await pull(); if(VERSION==null) return; }
  PUSHING=true; S.workouts=Math.max(1,L().sessions.length); const sentAt=S.savedAt;
  try{ const r=await api('POST','/sync/state',{state:S,savedAt:S.savedAt,version:VERSION});
    if(r.status===200){ VERSION=r.body.version; LAST_SYNC=Date.now(); SYNC_ERR=''; if(S.savedAt===sentAt) PENDING=false; else { clearTimeout(pushT); pushT=setTimeout(push,800); } }
    else if(r.status===409&&r.body&&!retry){ VERSION=r.body.version; if(r.body.state&&r.body.state.TRK){ setState(mergeStates(S,r.body.state)); cacheNow(); if(VIEW!=='session') render(); } PUSHING=false; return push(true); }
    else { SYNC_ERR=(r.body&&r.body.error)||('error '+r.status); }
  }catch(e){ SYNC_ERR='offline'; }
  PUSHING=false; if(VIEW==='me') render();
}
async function flush(){ clearTimeout(pushT); if(PENDING) await push(); }
/* pull merges whenever the server moved on, so nothing from another phone is ever overwritten */
async function pull(){ try{ const r=await api('GET','/sync/state'); if(r.status!==200) return; const b=r.body;
  if(b.state&&b.state.TRK&&b.version!==VERSION){ setState(mergeStates(S,b.state)); VERSION=b.version; cacheNow(); PENDING=true; if(VIEW!=='session') render(); clearTimeout(pushT); pushT=setTimeout(push,300); }
  else VERSION=b.version==null?0:b.version; }catch(e){} }
window.addEventListener('online',()=>{ if(MODE==='live'&&PENDING) push(); });
setInterval(()=>{ if(MODE==='live'&&PENDING) push(); },30000);
document.addEventListener('visibilitychange',()=>{ if(MODE!=='live'||!S||!S.TRK) return; if(document.visibilityState==='hidden') flush(); else pull(); });

async function bootUser(u){
  CACHE_ID=u.uid; let local=null; try{ local=JSON.parse(localStorage.getItem(cacheKey())||'null'); }catch(e){}
  if(local&&!local.TRK) local=null;
  $('scroll').innerHTML='<div style="padding:160px 0;text-align:center" class="sub">Loading your program…</div>';
  let server=null, ok=false;
  try{ const r=await api('GET','/sync/state'); if(r.status===200){ server=r.body||{}; ok=true; VERSION=server.version==null?0:server.version; } }catch(e){}
  const sv=ok&&server.state&&server.state.TRK?server.state:null;
  const invOk=INV&&INV.profile&&(INV.profile.email||'').toLowerCase()===(u.email||'').toLowerCase();
  if(sv&&local){ setState(mergeStates(local,sv)); cacheNow(); LAST_SYNC=Date.now(); PENDING=true; onSave(); }
  else if(sv){ setState(sv); cacheNow(); LAST_SYNC=Date.now(); }
  else if(local){ setState(local); PENDING=true; if(ok) onSave(); }          // offline, or server has nothing yet: keep what is on this phone
  else if(!ok){ $('scroll').innerHTML=`<div style="padding:120px 10px 0;text-align:center"><h1 class="h3">Can't reach the server</h1><p class="sub" style="margin-top:10px;font-size:15px">Check your connection and try again. Nothing has been lost.</p><button class="btn black" style="margin-top:20px" onclick="bootUser(firebase.auth().currentUser)">Try again</button></div>`; return; }
  else if(invOk){ const s=freshState(INV.plan,INV.profile); if(server.state) s.LEGACY=server.state; setState(s); save(); }
  else { $('scroll').innerHTML=`<div style="padding:120px 10px 0;text-align:center"><h1 class="h3">No program on this account yet</h1><p class="sub" style="margin-top:10px;font-size:15px">${INV?'This link was made for '+esc(INV.profile.email)+'. You signed in as '+esc(u.email)+'.':'Open the link Siddharth emailed you on this phone, then sign in again.'}</p><button class="btn grey" style="margin-top:20px" onclick="signOut()">Sign out</button></div>`; return; }
  S.profile.email=S.profile.email||u.email; closeStale(); VIEW='today'; HIST=[]; render();
  const live=L().sessions.find(s=>!s.endedAt&&s.date===today()); if(live) snack('You have a workout in progress');
}
function bootLive(){
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(u=>{ if(u) bootUser(u); else { if(INV&&INV.profile){ AUTH.email=INV.profile.email; } else AUTH.mode='signin'; showAuth(); } });
}

window.addEventListener('hashchange',async()=>{ if(MODE!=='live') return; const inv=await openInvite(); if(inv){ INV=inv; if(!firebase.auth().currentUser){ AUTH={mode:'create',email:inv.profile.email,msg:'',busy:false}; showAuth(); } else if(!S||!S.TRK) bootUser(firebase.auth().currentUser); } });

/*DEMO_END*/ /* ---------- start ---------- */
(async function(){
  layer();
  if(MODE==='demo'){ CACHE_ID='demo'; demoFresh(PLAN_DEMO.start); return; }
  INV=await openInvite();
  bootLive();
})();
